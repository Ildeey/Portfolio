<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Личный кабинет — KLIMOV ILYA</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin: 0; min-height: 100vh; background: #080808; color: #f5f5f5; font-family: 'Montserrat', system-ui, sans-serif; }
    .wrap { max-width: 980px; margin: 36px auto; padding: 0 20px; }
    .admin-card { background: #0f0f0f; border: 1px solid #1c1c1c; border-radius: 1.25rem; padding: 1.5rem; }
    .admin-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .admin-title { font-size: 0.95rem; letter-spacing: 0.14em; color: #a3a3a3; text-transform: uppercase; }
    .admin-badge { margin-top: 0.5rem; color: #7f7f7f; font-size: 0.9rem; }
    .tab-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .tab-button { padding: 0.85rem 1rem; border-radius: 9999px; border: 1px solid #1c1c1c; background: transparent; color: #d4d4d4; cursor: pointer; transition: all 0.18s var(--ease-out); }
    .tab-button.active { background: #38d26b; border-color: #38d26b; color: #060606; }
    .card-panel { background: #111; border: 1px solid #1f1f1f; border-radius: 1rem; padding: 1.5rem; }
    .field-grid { display: grid; gap: 1rem; margin-bottom: 1rem; }
    .field-grid input, .field-grid textarea { width: 100%; padding: 0.95rem 1rem; border-radius: 0.9rem; border: 1px solid #262626; background: #090909; color: #f0f0f0; }
    .field-grid input::placeholder, .field-grid textarea::placeholder { color: #6f6f6f; }
    .section-title { margin: 0 0 1rem; font-size: 1.35rem; }
    .admin-note { color: #9a9a9a; font-size: 0.95rem; margin-top: 0.5rem; }
    .dashboard-grid { display: grid; gap: 1.5rem; }
    .project-list { display: grid; gap: 1rem; }
    .project-card { display: grid; grid-template-columns: 1fr 2fr auto; gap: 1rem; align-items: center; padding: 1rem; border: 1px solid #1f1f1f; border-radius: 1rem; background: #0b0b0b; }
    .project-card h4 { margin: 0 0 0.35rem; font-size: 1rem; }
    .project-card p { margin: 0; color: #a3a3a3; font-size: 0.95rem; line-height: 1.5; }
    .project-card-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #7f7f7f; }
    .project-card-actions { display: flex; gap: 0.5rem; }
    .project-card-actions button { font-size: 0.8rem; }
    .panel-title { font-size: 1.1rem; margin-bottom: 1rem; }
    .hidden { display: none; }
    @media (max-width: 768px) { .admin-header { flex-direction: column; align-items: stretch; } .project-card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="admin-card">
      <header class="admin-header">
        <div>
          <div class="admin-title">I. A. KLIMOV — Личный кабинет</div>
          <div id="userBadge" class="admin-badge">Не выполнен вход</div>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;">
          <button class="btn btn-ghost" id="btnHome">Главная</button>
          <button class="btn btn-ghost hidden" id="btnLogout">Выйти</button>
        </div>
      </header>

      <div class="tab-buttons" id="tabButtons">
        <button class="tab-button active" id="tabLogin">Войти</button>
        <button class="tab-button" id="tabRegister">Регистрация</button>
      </div>

      <div id="authWrapper">
        <section id="loginPanel" class="card-panel">
          <h2 class="section-title">Вход</h2>
          <div class="field-grid">
            <input id="loginUser" type="text" placeholder="Имя пользователя или email" autocomplete="username">
            <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
          </div>
          <button class="btn btn-primary" id="btnLogin">Войти</button>
          <p class="admin-note">Владелец сайта может войти как <strong>admin</strong> / <strong>admin123</strong>.</p>
        </section>

        <section id="registerPanel" class="card-panel hidden">
          <h2 class="section-title">Регистрация</h2>
          <div class="field-grid">
            <input id="regUser" type="text" placeholder="Имя пользователя" autocomplete="username">
            <input id="regEmail" type="email" placeholder="Email" autocomplete="email">
            <input id="regPhone" type="tel" placeholder="Телефон">
            <input id="regPass" type="password" placeholder="Пароль" autocomplete="new-password">
          </div>
          <button class="btn btn-primary" id="btnRegister">Зарегистрироваться</button>
        </section>
      </div>

      <section id="dashboardPanel" class="card-panel hidden">
        <div id="dashboardText" class="admin-note"></div>

        <div id="adminSection" class="dashboard-grid hidden">
          <div>
            <h2 class="section-title">Добавить проект</h2>
            <form id="projectForm">
              <div class="field-grid">
                <input id="projectCategory" type="text" placeholder="Категория" required>
                <input id="projectTitle" type="text" placeholder="Название проекта" required>
                <textarea id="projectDescription" rows="4" placeholder="Описание проекта" required></textarea>
                <label class="file-field">
                  <span>Выбрать фото проекта</span>
                  <input id="projectImage" type="file" accept="image/jpeg,image/png,image/webp">
                </label>
              </div>
              <button class="btn btn-primary" id="btnSaveProject" type="submit">Добавить проект</button>
            </form>
          </div>

          <div>
            <h3 class="panel-title">Проекты</h3>
            <div id="projectList" class="project-list"></div>
          </div>
        </div>

        <div id="clientSection" class="dashboard-grid hidden">
          <h2 class="section-title">Пользовательский кабинет</h2>
          <p class="admin-note">Вы вошли как пользователь. Запросы отправляются через главную страницу.</p>
          <button class="btn btn-primary" id="btnToHome">Перейти на главную</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    const API_BASE = './api';
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');
    const dashboardPanel = document.getElementById('dashboardPanel');
    const authWrapper = document.getElementById('authWrapper');
    const adminSection = document.getElementById('adminSection');
    const clientSection = document.getElementById('clientSection');
    const userBadge = document.getElementById('userBadge');
    const btnLogout = document.getElementById('btnLogout');
    const btnHome = document.getElementById('btnHome');
    const btnToHome = document.getElementById('btnToHome');
    const btnLogin = document.getElementById('btnLogin');
    const btnRegister = document.getElementById('btnRegister');
    const projectForm = document.getElementById('projectForm');
    const projectList = document.getElementById('projectList');

    function apiFetch(url, options = {}) {
      return fetch(url, { credentials: 'include', headers: { Accept: 'application/json' }, ...options })
        .then(async response => {
          const data = await response.json().catch(() => null);
          if (!response.ok) {
            const error = data?.error || response.statusText || 'Ошибка запроса';
            throw new Error(error);
          }
          return data;
        });
    }

    function showTab(activeTab) {
      if (activeTab === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginPanel.classList.remove('hidden');
        registerPanel.classList.add('hidden');
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerPanel.classList.remove('hidden');
        loginPanel.classList.add('hidden');
      }
    }

    async function currentUser() {
      try {
        const data = await apiFetch(`${API_BASE}/auth.php?action=current`);
        return data.user || null;
      } catch {
        return null;
      }
    }

    async function login() {
      const login = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!login || !password) {
        alert('Введите логин и пароль');
        return;
      }

      try {
        const data = await apiFetch(`${API_BASE}/auth.php?action=login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password }),
        });
        renderUser(data.user);
      } catch (error) {
        alert(error.message);
      }
    }

    async function registerUser() {
      const username = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPass').value;
      if (!username || !email || !password) {
        alert('Заполните все поля');
        return;
      }

      try {
        const data = await apiFetch(`${API_BASE}/auth.php?action=register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone, password }),
        });
        renderUser(data.user);
      } catch (error) {
        alert(error.message);
      }
    }

    async function logout() {
      try {
        await apiFetch(`${API_BASE}/auth.php?action=logout`, { method: 'POST' });
      } catch {
        // ignore
      }
      renderUser(null);
    }

    function renderUser(user) {
      if (!user) {
        authWrapper.classList.remove('hidden');
        dashboardPanel.classList.add('hidden');
        btnLogout.classList.add('hidden');
        userBadge.textContent = 'Не выполнен вход';
        adminSection.classList.add('hidden');
        clientSection.classList.add('hidden');
        return;
      }

      authWrapper.classList.add('hidden');
      dashboardPanel.classList.remove('hidden');
      btnLogout.classList.remove('hidden');
      userBadge.textContent = `В системе: ${user.username} (${user.role})`;

      if (user.role === 'admin') {
        adminSection.classList.remove('hidden');
        clientSection.classList.add('hidden');
        document.getElementById('dashboardText').textContent = 'Вы можете добавлять проекты и управлять их списком.';
        loadProjects();
      } else {
        clientSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
        document.getElementById('dashboardText').textContent = 'Вы вошли как пользователь. Запросы отправляются через главную страницу.';
      }
    }

    function renderProjectList(projects) {
      if (!projectList) return;
      if (!projects || projects.length === 0) {
        projectList.innerHTML = '<div class="admin-note">Проекты отсутствуют.</div>';
        return;
      }

      projectList.innerHTML = projects
        .map(project => `
          <div class="project-card">
            <div>
              <h4>${escapeHtml(project.title)}</h4>
              <p class="project-card-meta">${escapeHtml(project.category)} · ${escapeHtml(formatDate(project.created_at))}</p>
              <p>${escapeHtml(project.description)}</p>
            </div>
            <div class="project-card-actions">
              <button class="btn btn-ghost" data-delete-id="${project.id}">Удалить</button>
            </div>
          </div>
        `)
        .join('');

      projectList.querySelectorAll('[data-delete-id]').forEach(button => {
        button.addEventListener('click', async () => {
          const id = button.getAttribute('data-delete-id');
          if (!id || !confirm('Удалить проект?')) return;
          try {
            await apiFetch(`${API_BASE}/projects.php?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
            loadProjects();
          } catch (error) {
            alert(error.message);
          }
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}`;
    }

    async function loadProjects() {
      try {
        const data = await apiFetch(`${API_BASE}/projects.php`);
        renderProjectList(data.projects || []);
      } catch (error) {
        projectList.innerHTML = `<div class="admin-note">${escapeHtml(error.message)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      tabLogin.addEventListener('click', () => showTab('login'));
      tabRegister.addEventListener('click', () => showTab('register'));
      btnLogin.addEventListener('click', login);
      btnRegister.addEventListener('click', registerUser);
      btnLogout.addEventListener('click', logout);
      btnHome.addEventListener('click', () => window.location.href = 'index.html');
      btnToHome.addEventListener('click', () => window.location.href = 'index.html');
      projectForm.addEventListener('submit', async event => {
        event.preventDefault();
        const title = document.getElementById('projectTitle').value.trim();
        const category = document.getElementById('projectCategory').value.trim();
        const description = document.getElementById('projectDescription').value.trim();
        const imageInput = document.getElementById('projectImage');

        if (!title || !category || !description) {
          alert('Заполните все поля проекта');
          return;
        }

        const formData = new FormData();
        formData.append('title', title);
        formData.append('category', category);
        formData.append('description', description);
        if (imageInput.files.length > 0) {
          formData.append('image', imageInput.files[0]);
        }

        try {
          await fetch(`${API_BASE}/projects.php`, {
            method: 'POST',
            body: formData,
            credentials: 'include',
          }).then(async response => {
            const data = await response.json().catch(() => null);
            if (!response.ok) {
              throw new Error(data?.error || 'Ошибка добавления проекта');
            }
          });

          document.getElementById('projectForm').reset();
          await loadProjects();
          alert('Проект добавлен');
        } catch (error) {
          alert(error.message);
        }
      });

      currentUser().then(user => renderUser(user));
    });
  </script>
</body>
</html>
